[project]
name = "dagster-sensor-guard"
version = "0.4.0"
description = "A decorator that adds configurable error tolerance to Dagster sensors, suppressing transient failures and only raising errors after consecutive failure thresholds are breached."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yudiell Hernandez", email = "yudiell@outlook.com" }
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "dagster>=1.9.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[dependency-groups]
dev = [
    "dagster==1.11.16",
    "pytest>=8.0",
    "pip-audit>=2.8,<2.9; python_version < '3.10'",
    "pip-audit>=2.10; python_version >= '3.10'",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
